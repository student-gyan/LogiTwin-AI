services:
  mysql:
    image: mysql:8.4
    container_name: logitwin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: logi_twin_ai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-logi-root-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/logi_twin_complete.sql:/docker-entrypoint-initdb.d/01-logi-twin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend-java
    container_name: logitwin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/logi_twin_ai?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-logi-root-password}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-32-byte-secret}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5500
    ports:
      - "8080:8080"

  ai-python:
    build: ./ai-python
    container_name: logitwin-ai-python
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-logi-root-password}@mysql:3306/logi_twin_ai
      CORS_ORIGINS: http://localhost:8080,http://localhost:5500
    ports:
      - "8000:8000"

volumes:
  mysql_data:
