spring:
  application:
    name: logi-twin-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/logi_twin_ai?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: root
    password: Gy12@#$
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
server:
  port: ${PORT:8080}
  error:
    include-message: never
logi-twin:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:5500}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
